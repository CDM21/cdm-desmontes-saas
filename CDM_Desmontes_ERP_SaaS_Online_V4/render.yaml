databases:
  - name: cdm-desmontes-db
    plan: free

services:
  - type: web
    name: cdm-desmontes-saas
    runtime: docker
    plan: free
    # O repositório atual do usuário mantém o app nesta subpasta.
    dockerfilePath: ./CDM_Desmontes_ERP_SaaS_Online_V4/Dockerfile
    dockerContext: ./CDM_Desmontes_ERP_SaaS_Online_V4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cdm-desmontes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
      - key: CDM_MONTHLY_PRICE
        value: "350"
      - key: FOCUS_NFE_MASTER_TOKEN
        sync: false
      - key: CDM_INTEGRATION_POLL_SECONDS
        value: "60"
