databases:
  - name: cdm-desmontes-db
    plan: free

services:
  - type: web
    name: cdm-desmontes-saas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cdm-desmontes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
